name: CMake (Windows, Presets)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # VS 2022
          - name: VS2022 Debug CPU
            runner: windows-latest   # windows-latest has VS 2022
            configure_preset: vs22_x64-debug-cpu   # (ok to use vs22_x64 too)
            build_preset: vs22_x64-debug-cpu
            configuration: Debug
          - name: VS2022 Release CPU
            runner: windows-latest
            configure_preset: vs22_x64-release-cpu
            build_preset: vs22_x64-release-cpu
            configuration: Release
          - name: VS2022 Debug D3D12
            runner: windows-latest   # windows-latest has VS 2022
            configure_preset: vs22_x64-debug-d3d12   # (ok to use vs22_x64 too)
            build_preset: vs22_x64-debug-d3d12
            configuration: Debug
          - name: VS2022 Release D3D12
            runner: windows-latest
            configure_preset: vs22_x64-release-d3d12
            build_preset: vs22_x64-release-d3d12
            configuration: Release
          # Clang on Ubuntu
          - name: Clang Ubuntu Debug CPU
            runner: ubuntu-latest
            configure_preset: clang_ubuntu-debug-cpu
            build_preset: clang_ubuntu-debug-cpu
            configuration: Debug
          - name: Clang Ubuntu Release CPU
            runner: ubuntu-latest
            configure_preset: clang_ubuntu-release-cpu
            build_preset: clang_ubuntu-release-cpu
            configuration: Release
          # GCC on Ubuntu
          - name: GCC Ubuntu Debug CPU
            runner: ubuntu-latest
            configure_preset: gcc_ubuntu-debug-cpu
            build_preset: gcc_ubuntu-debug-cpu
            configuration: Debug
          - name: GCC Ubuntu Release CPU
            runner: ubuntu-latest
            configure_preset: gcc_ubuntu-release-cpu
            build_preset: gcc_ubuntu-release-cpu
            configuration: Release

    steps:
      - uses: actions/checkout@v4

      # Optional: ensure MSVC environment is set (usually not needed on GH runners)
      # - uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: chmod +x init.sh && ./init.sh

      - name: Configure (CMake preset)
        run: cmake --preset "${{ matrix.configure_preset }}"

      - name: Build (CMake build preset)
        run: cmake --build --preset "${{ matrix.build_preset }}"

      - name: Test (ctest)
        shell: pwsh
        run: |
          # Compute the preset's build directory exactly as in your presets:
          $buildDir = Join-Path $PWD "out/build/${{ matrix.build_preset }}"
          if (-not (Test-Path $buildDir)) {
            Write-Error "Build directory not found: $buildDir"
          }
          ctest --test-dir "$buildDir" -C "${{ matrix.configuration }}" --output-on-failure
